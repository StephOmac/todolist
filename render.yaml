services:
  - type: web
    name: todolist
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn web_app:app
    disk:
      name: todo-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: TASKS_FILE
        value: /var/data/tasks.json
      - key: SECRET_KEY
        generateValue: true